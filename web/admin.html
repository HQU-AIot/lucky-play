<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽奖后台</title>
<style>
  :root {
    --bg: #10141f; --panel: #171d2b; --panel-2: #1d2436;
    --ink: #e8edf7; --dim: #93a0b8; --line: #2a3350;
    --accent: #4f8cff; --ok: #35c98e; --warn: #ffb84d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .hint { font-weight: 400; color: var(--dim); font-size: 12px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  input, select {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; width: 100%;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    cursor: pointer; border: none; border-radius: 8px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; padding: 9px 18px;
  }
  button.ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: transparent; color: #ff7a7a; border: 1px solid #58262c; }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1; min-width: 150px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  td input { width: 90px; padding: 6px 8px; }
  td input.stock-in { width: 76px; }
  .prob-bar { position: relative; background: var(--panel-2); border-radius: 999px; height: 10px; width: 130px; overflow: hidden; }
  .prob-bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4f8cff, #7bd0ff); border-radius: 999px; transition: width .5s ease; }
  .prob-val { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; margin-left: 8px; }
  .switch { display: flex; align-items: center; gap: 10px; }
  .switch select { width: auto; }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.7; }
  .stat-grid { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { background: var(--panel-2); border-radius: 10px; padding: 10px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--dim); }
  #history { max-height: 320px; overflow: auto; }
  .token-gate { max-width: 380px; margin: 18vh auto; text-align: center; }
  .token-gate input { text-align: center; margin: 14px 0; }
  .msg { font-size: 12px; margin-left: 10px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: #ff7a7a; }
  .log-item { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .log-item .ts { color: var(--dim); }
  .log-item.win { color: #9fe8c6; }
</style>
</head>
<body>

<div class="token-gate" id="gate">
  <h1>抽奖后台</h1>
  <p class="sub">输入管理令牌（默认 lucky-admin，可用环境变量 LUCKY_ADMIN_TOKEN 覆盖）</p>
  <input type="password" id="token-in" placeholder="管理令牌" autocomplete="off">
  <div><button id="token-go">进入</button></div>
  <p class="msg err" id="gate-msg"></p>
</div>

<div class="wrap" id="console" hidden>
  <h1>抽奖后台</h1>
  <p class="sub">概率 / 库存 / 动态转移 · 改动即时生效，无需重启</p>

  <div class="card">
    <h2>活动信息</h2>
    <div class="row">
      <div class="field"><label>活动名称</label><input id="ev-name"></div>
      <div class="field"><label>开奖日期（国庆前夜填 2026-09-30）</label><input id="ev-date" placeholder="2026-09-30"></div>
      <div class="field"><label>一句话副标</label><input id="ev-note"></div>
      <button id="ev-save">保存</button><span class="msg" id="ev-msg"></span>
    </div>
  </div>

  <div class="card">
    <h2>谢谢参与 · 动态概率 <span class="hint">奖品被抽走时，概率自动让给谢谢参与</span></h2>
    <div class="row">
      <div class="field" style="max-width:180px"><label>谢谢参与基础权重</label><input type="number" id="thanks-weight" min="0" step="0.5"></div>
      <div class="switch">
        <label style="margin:0">动态转移</label>
        <select id="dyn-enabled">
          <option value="1">开启</option>
          <option value="0">关闭</option>
        </select>
        <select id="dyn-mode">
          <option value="per_win">每抽一件渐移（推荐）</option>
          <option value="depleted">抽空才整移</option>
        </select>
        <button id="dyn-save">保存</button><span class="msg" id="dyn-msg"></span>
      </div>
    </div>
    <p class="note" id="dyn-explain"></p>
  </div>

  <div class="card">
    <h2>奖品与概率 <span class="hint">权重为相对值，无需凑 100</span></h2>
    <table>
      <thead><tr>
        <th>奖品</th><th>基础权重</th><th>当前概率</th><th>剩余 / 总量</th><th>补货操作</th>
      </tr></thead>
      <tbody id="prize-rows"></tbody>
    </table>
    <div class="row" style="margin-top:14px">
      <button id="w-save">保存权重</button><span class="msg" id="w-msg"></span>
      <button id="w-thanks-save" class="ghost">保存谢谢参与权重</button>
      <button id="replenish" class="ghost">全部补货</button>
    </div>
  </div>

  <div class="card">
    <h2>统计</h2>
    <div class="stat-grid" id="stat-grid"></div>
  </div>

  <div class="card">
    <h2>抽奖记录 <span class="hint">最近 100 条</span></h2>
    <div id="history"></div>
    <div class="row" style="margin-top:12px">
      <button id="h-reset" class="danger">清空记录</button><span class="msg" id="h-msg"></span>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem("lucky.admin_token") || "";

const MODE_TEXT = {
  per_win: "每抽走一件奖品，按比例把它的权重即时让给谢谢参与；库存抽空时恰好整体转移完。总概率恒定，只做再分配。",
  depleted: "整个奖品被抽空后，它的全部权重一次性让给谢谢参与；没抽空前概率保持不变。",
};

async function req(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Admin-Token": token, ...(options.headers || {}) },
  });
  if (res.status === 401) { showGate("令牌失效，重新输入"); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

function showGate(msg) {
  $("#gate").hidden = false;
  $("#console").hidden = true;
  $("#gate-msg").textContent = msg || "";
}

function flash(id, text, ok = true) {
  const el = $(id);
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
  setTimeout(() => { el.textContent = ""; }, 2600);
}

let stateData = null;

function renderState(d) {
  stateData = d;
  $("#ev-name").value = d.event.name || "";
  $("#ev-date").value = d.event.date || "";
  $("#ev-note").value = d.event.note || "";
  $("#thanks-weight").value = d.thanks_weight;
  $("#dyn-enabled").value = d.dynamic_enabled ? "1" : "0";
  $("#dyn-mode").value = d.dynamic_mode;
  $("#dyn-explain").textContent = MODE_TEXT[d.dynamic_mode] || "";

  const tbody = $("#prize-rows");
  tbody.innerHTML = "";
  for (const p of d.prizes) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.emoji} ${p.name}</td>
      <td><input type="number" min="0" step="0.5" class="w-in" data-id="${p.id}" value="${p.base_weight}"></td>
      <td><div style="display:flex;align-items:center">
        <div class="prob-bar"><i style="width:${(p.probability * 100).toFixed(1)}%"></i></div>
        <span class="prob-val">${(p.probability * 100).toFixed(1)}%</span></div></td>
      <td>${p.remaining} / ${p.total_stock}</td>
      <td><input type="number" min="0" step="1" class="stock-in" data-id="${p.id}" placeholder="补到" value=""></td>`;
    tbody.appendChild(tr);
  }
  const thanksTr = document.createElement("tr");
  thanksTr.innerHTML = `
    <td>🙏 谢谢参与</td>
    <td><input type="number" min="0" step="0.5" id="tw-row" value="${d.thanks_weight}"></td>
    <td><div style="display:flex;align-items:center">
      <div class="prob-bar"><i style="width:${(d.thanks_probability * 100).toFixed(1)}%"></i></div>
      <span class="prob-val">${(d.thanks_probability * 100).toFixed(1)}%</span></div></td>
    <td>不限量</td><td>—</td>`;
  tbody.appendChild(thanksTr);

  const grid = $("#stat-grid");
  const byPrize = d.stats.by_prize || {};
  const nameOf = (id) => (id === "thanks" ? "🙏 谢谢参与" : (d.prizes.find((p) => p.id === id) || {}).name || id);
  const entries = Object.entries(byPrize).sort((a, b) => b[1] - a[1]);
  grid.innerHTML = `<div class="stat"><b>${d.stats.total_draws}</b><span>累计抽奖</span></div>` +
    entries.map(([id, n]) => `<div class="stat"><b>${n}</b><span>${nameOf(id)}</span></div>`).join("");
  if (!entries.length) grid.innerHTML += `<div class="stat"><b>0</b><span>还没有人抽过</span></div>`;
}

async function loadAll() {
  const d = await req("/api/admin/state");
  renderState(d);
  const h = await req("/api/admin/history?limit=100");
  const box = $("#history");
  box.innerHTML = h.records.length
    ? h.records.map((r) => `<div class="log-item ${r.result === "prize" ? "win" : ""}">
        <span>${r.result === "prize" ? "🎁 " + r.prize_name : "🙏 谢谢参与"}</span>
        <span class="ts">${(r.ts || "").replace("T", " ")}</span></div>`).join("")
    : `<p class="note">还没有记录</p>`;
}

$("#token-go").addEventListener("click", async () => {
  token = $("#token-in").value.trim();
  try {
    await req("/api/admin/state");
    localStorage.setItem("lucky.admin_token", token);
    $("#gate").hidden = true;
    $("#console").hidden = false;
    await loadAll();
  } catch (e) {
    if (e.message !== "unauthorized") showGate("登录失败：" + e.message);
  }
});
$("#token-in").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#token-go").click(); });

$("#ev-save").addEventListener("click", async () => {
  try {
    await req("/api/admin/event", { method: "PUT", body: JSON.stringify({
      name: $("#ev-name").value, date: $("#ev-date").value, note: $("#ev-note").value,
    })});
    flash("#ev-msg", "已保存");
  } catch (e) { flash("#ev-msg", "失败：" + e.message, false); }
});

$("#dyn-save").addEventListener("click", async () => {
  try {
    await req("/api/admin/dynamic", { method: "PUT", body: JSON.stringify({
      enabled: $("#dyn-enabled").value === "1", mode: $("#dyn-mode").value,
    })});
    $("#dyn-explain").textContent = MODE_TEXT[$("#dyn-mode").value] || "";
    flash("#dyn-msg", "已保存");
    await loadAll();
  } catch (e) { flash("#dyn-msg", "失败：" + e.message, false); }
});

$("#w-save").addEventListener("click", async () => {
  try {
    const weights = {};
    document.querySelectorAll(".w-in").forEach((el) => { weights[el.dataset.id] = Number(el.value) || 0; });
    const tw = $("#tw-row").value;
    await req("/api/admin/weights", { method: "PUT", body: JSON.stringify({
      weights, thanks_weight: tw === "" ? null : Number(tw),
    })});
    flash("#w-msg", "权重已生效");
    await loadAll();
  } catch (e) { flash("#w-msg", "失败：" + e.message, false); }
});

$("#w-thanks-save").addEventListener("click", async () => {
  try {
    const weights = {};
    document.querySelectorAll(".w-in").forEach((el) => { weights[el.dataset.id] = Number(el.value) || 0; });
    await req("/api/admin/weights", { method: "PUT", body: JSON.stringify({
      weights, thanks_weight: Number($("#tw-row").value) || 0,
    })});
    flash("#w-msg", "已生效");
    await loadAll();
  } catch (e) { flash("#w-msg", "失败：" + e.message, false); }
});

$("#prize-rows").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.classList.contains("stock-in")) {
    e.target.nextElementSibling?.click();
  }
});

document.addEventListener("click", async (e) => {
  if (!e.target.classList.contains("stock-apply-btn")) return;
  const id = e.target.dataset.id;
  const input = document.querySelector(`.stock-in[data-id="${id}"]`);
  if (!input || input.value === "") return;
  try {
    await req("/api/admin/stock", { method: "PUT", body: JSON.stringify({ id, remaining: Number(input.value) }) });
    input.value = "";
    flash("#w-msg", "库存已更新");
    await loadAll();
  } catch (err) { flash("#w-msg", "失败：" + err.message, false); }
});

// 给每行补货输入框配一个应用按钮（渲染后绑定）
new MutationObserver(() => {
  document.querySelectorAll(".stock-in").forEach((input) => {
    if (input.nextElementSibling?.classList.contains("stock-apply-btn")) return;
    const btn = document.createElement("button");
    btn.className = "ghost stock-apply-btn";
    btn.dataset.id = input.dataset.id;
    btn.textContent = "应用";
    btn.style.cssText = "padding:6px 12px;font-size:12px;margin-left:6px";
    input.after(btn);
  });
}).observe($("#prize-rows"), { childList: true, subtree: false });

$("#replenish").addEventListener("click", async () => {
  try {
    await req("/api/admin/replenish", { method: "POST" });
    flash("#w-msg", "已全部补货");
    await loadAll();
  } catch (e) { flash("#w-msg", "失败：" + e.message, false); }
});

$("#h-reset").addEventListener("click", async () => {
  if (!confirm("确定清空全部抽奖记录？（奖品库存不受影响）")) return;
  try {
    await req("/api/admin/history/reset", { method: "POST" });
    flash("#h-msg", "已清空");
    await loadAll();
  } catch (e) { flash("#h-msg", "失败：" + e.message, false); }
});

(async function boot() {
  if (!token) { showGate(""); return; }
  try {
    await req("/api/admin/state");
    $("#gate").hidden = true;
    $("#console").hidden = false;
    await loadAll();
  } catch {
    showGate("保存的令牌已失效，重新输入");
  }
})();
</script>
</body>
</html>
