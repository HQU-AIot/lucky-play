<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>幸运抽奖</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/themes.css">
</head>
<body data-theme="festive" data-form="wheel">

<div class="bg-fx" aria-hidden="true">
  <canvas id="bg-canvas"></canvas>
  <div class="bg-deco"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-glyph" aria-hidden="true"></span>
    <div class="brand-text">
      <h1 class="brand-name" id="event-name">幸运抽奖</h1>
      <p class="brand-sub">
        <span class="date-badge" id="event-date"></span>
        <span class="event-note" id="event-note"></span>
        <span class="countdown" id="event-countdown" hidden></span>
      </p>
    </div>
  </div>
  <nav class="toolbar">
    <button class="tool-btn icon-only" id="btn-sound" title="音效开关" aria-pressed="true">🔊</button>
    <button class="tool-btn" id="btn-form">玩法</button>
    <button class="tool-btn" id="btn-theme">风格</button>
    <a class="tool-btn" href="/admin" target="_blank" rel="noopener">后台</a>
  </nav>
</header>

<main class="layout">
  <section class="stage" id="stage" aria-label="抽奖区"></section>

  <aside class="rail">
    <section class="panel">
      <header class="panel-head">
        <h2>奖品与余量</h2>
        <span class="stock-total" id="stock-total"></span>
      </header>
      <ul class="stock-list" id="stock-list"></ul>
    </section>
    <section class="panel panel-log">
      <header class="panel-head"><h2>本场战绩</h2></header>
      <ul class="log-list" id="log-list">
        <li class="log-empty">暂无记录，等你抽走第一份好运</li>
      </ul>
    </section>
  </aside>
</main>

<div class="overlay" id="overlay-theme" hidden>
  <div class="overlay-card" role="dialog" aria-modal="true" aria-label="选择风格">
    <header class="overlay-head">
      <h2>挑一套风格</h2>
      <button class="overlay-close" data-close aria-label="关闭">✕</button>
    </header>
    <div class="theme-grid" id="theme-grid"></div>
  </div>
</div>

<div class="overlay" id="overlay-form" hidden>
  <div class="overlay-card" role="dialog" aria-modal="true" aria-label="选择玩法">
    <header class="overlay-head">
      <h2>选个玩法</h2>
      <button class="overlay-close" data-close aria-label="关闭">✕</button>
    </header>
    <div class="form-grid" id="form-grid"></div>
  </div>
</div>

<div class="reveal-mask" id="reveal" hidden>
  <div class="reveal-card" id="reveal-card" role="dialog" aria-modal="true" aria-label="开奖结果">
    <p class="reveal-kicker" id="reveal-kicker"></p>
    <div class="reveal-prize">
      <span class="reveal-emoji" id="reveal-emoji"></span>
      <h2 class="reveal-name" id="reveal-name"></h2>
    </div>
    <p class="reveal-note" id="reveal-note"></p>
    <div class="reveal-actions">
      <button class="btn-primary" id="reveal-again">再抽一次</button>
      <button class="btn-ghost" id="reveal-close">收下好礼</button>
    </div>
  </div>
</div>

<canvas class="confetti-canvas" id="confetti" aria-hidden="true"></canvas>

<script type="module" src="/js/app.js"></script>
</body>
</html>
