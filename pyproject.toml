[project]
name = "lucky-play"
version = "0.1.0"
description = "多形式 × 多主题抽奖系统（转盘/九宫格/盲盒/翻牌 × 6 套皮肤，含国庆主题）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
