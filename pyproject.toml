[project]
name = "lucky-play"
version = "1.0.0"
description = "多形式 × 多主题抽奖系统：大转盘/老虎机 × 6 套主题，服务端定结果、并发不超卖、奖池全可编辑"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "glong888" }, { name = "HQU-AIoT" }]
maintainers = [{ name = "glong888", url = "https://github.com/glong888" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
